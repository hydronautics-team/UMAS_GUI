name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          push: false
          tags: umas-gui-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check formatting
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/UMAS_GUI:ro" \
            umas-gui-ci:${{ github.sha }} \
            ./scripts/ci/format.sh

      - name: Build application
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/UMAS_GUI:ro" \
            umas-gui-ci:${{ github.sha }} \
            bash -lc 'source /opt/ros/humble/setup.bash && cmake -S /UMAS_GUI -B /tmp/umas-gui-build && cmake --build /tmp/umas-gui-build --parallel "$(nproc)"'
